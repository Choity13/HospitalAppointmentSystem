{% extends 'base.html' %}
{% block title %}Register - MediCare BD{% endblock %}

{% block content_unauth %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); padding:24px;">
    <div style="width:100%;max-width:500px;">
        <div style="background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:40px;">
            <div class="text-center mb-4">
                <div style="width:56px;height:56px;background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:16px;">📋</div>
                <h3 class="fw-bold text-white mb-1">Create Account</h3>
                <p style="color:rgba(255,255,255,0.5);font-size:0.875rem;">Join MediCare Bangladesh today</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold" style="color:rgba(255,255,255,0.8);font-size:0.85rem;">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Your full name" required
                               style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:white;border-radius:10px;padding:12px 16px;">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" style="color:rgba(255,255,255,0.8);font-size:0.85rem;">Phone Number</label>
                        <input type="text" name="phone_number" class="form-control" placeholder="8801XXXXXXXXX" required
                               style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:white;border-radius:10px;padding:12px 16px;">
                        <div style="color:rgba(255,255,255,0.35);font-size:0.75rem;margin-top:4px;">Bangladesh format: 8801XXXXXXXXX</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" style="color:rgba(255,255,255,0.8);font-size:0.85rem;">Mobile Carrier</label>
                        <select name="carrier" class="form-select" required
                                style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:white;border-radius:10px;padding:12px 16px;">
                            <option value="" disabled selected>Select your carrier</option>
                            <option value="Grameenphone">Grameenphone</option>
                            <option value="Robi">Robi</option>
                            <option value="Banglalink">Banglalink</option>
                            <option value="Teletalk">Teletalk</option>
                            <option value="Airtel">Airtel</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" style="color:rgba(255,255,255,0.8);font-size:0.85rem;">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Min 8 chars" required
                               style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:white;border-radius:10px;padding:12px 16px;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" style="color:rgba(255,255,255,0.8);font-size:0.85rem;">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required
                               style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:white;border-radius:10px;padding:12px 16px;">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold"
                                style="background:linear-gradient(135deg,#6366f1,#4f46e5);border:none;border-radius:10px;font-size:1rem;">
                            Create Account <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </div>
                </div>
            </form>

            <p class="text-center mt-4 mb-0" style="color:rgba(255,255,255,0.5);font-size:0.85rem;">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" style="color:#a5b4fc;font-weight:600;text-decoration:none;">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
