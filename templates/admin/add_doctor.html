{% extends 'base.html' %}
{% block title %}Add Doctor - MediCare BD{% endblock %}
{% block page_title %}Add New Doctor{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header py-3 px-4" style="background:white; border-bottom:1px solid var(--border);">
                <h6 class="fw-bold mb-0">
                    <i class="bi bi-person-plus me-2" style="color:var(--primary);"></i>
                    Register New Doctor
                </h6>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.add_doctor') }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control"
                               placeholder="Doctor's full name (without Dr. prefix)" required>
                        <div class="form-text">Do not include "Dr." — it is added automatically.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Phone Number <span class="text-danger">*</span></label>
                        <input type="text" name="phone" class="form-control"
                               placeholder="8801XXXXXXXXX" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Min 8 characters" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Department <span class="text-danger">*</span></label>
                        <select name="department" class="form-select" required>
                            <option value="" disabled selected>Select department</option>
                            {% for dept in departments %}
                            <option value="{{ dept.dept_id }}">{{ dept.dept_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Specialty <span class="text-danger">*</span></label>
                        <input type="text" name="specialty" class="form-control"
                               placeholder="e.g. Cardiologist, Pediatrician" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Consultation Fee (৳) <span class="text-danger">*</span></label>
                        <input type="number" name="consultation_fee" class="form-control"
                               placeholder="e.g. 800" min="0" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Bio</label>
                        <textarea name="bio" class="form-control" rows="3"
                                  placeholder="Brief professional bio…"></textarea>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-check-circle me-2"></i>Add Doctor
                        </button>
                        <a href="{{ url_for('admin.doctors') }}" class="btn btn-outline-secondary fw-semibold px-4">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
